<!DOCTYPE html>
<html>
<head>
    <title>Word Search Game</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Kid-Friendly Word Search Game</h1>

<p><strong>Hint:</strong> {{ hint }}</p>

<table>
    {% for row in grid %}
    <tr>
        {% for letter in row %}
        <td>{{ letter }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>

<form method="POST">
    <input type="text" name="guess" placeholder="Type a word">
    <button type="submit">Submit</button>
</form>

<p>{{ message }}</p>

</body>
</html>
